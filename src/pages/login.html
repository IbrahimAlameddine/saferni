<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="سجّل الدخول إلى حسابك في سفرني وتابع رحلتك القادمة."
    />
    <link rel="icon" type="image/png" href="assets/images/icon.png" />
    <title>تسجيل الدخول | سفرني</title>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <img
          class="auth-icon"
          src="assets/images/icon.png"
          alt="أيقونة سفرني"
        />
        <h1 id="login-title">مرحبًا بعودتك إلى سفرني!</h1>
        <p class="auth-description">
          يسعدنا رجوعك. سجّل الدخول وتابع التخطيط لمغامرتك القادمة.
        </p>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="login-email"
              >البريد الإلكتروني</label
            >
            <input
              class="form-control"
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">كلمة المرور</label>
            <input
              class="form-control"
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="auth-form-options mb-4">
            <a href="mailto:saferni@gmail.com?subject=استعادة%20كلمة%20المرور"
              >هل نسيت كلمة المرور؟</a
            >
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">
            تسجيل الدخول
          </button>
        </form>

        <p class="auth-switch mb-0">
          ليس لديك حساب؟
          <a href="register.html">إنشاء حساب جديد</a>
        </p>
      </section>
    </main>
  </body>
</html>
